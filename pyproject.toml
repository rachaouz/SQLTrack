[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqltrace"
version = "1.0.0"
description = "Column-level lineage for SQL queries: trace where every output column comes from."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["sqlglot>=30.0,<31"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sqltrace = "sqltrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
